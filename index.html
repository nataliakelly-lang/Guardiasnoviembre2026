<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardias Koltin — Noviembre 2026</title>
<style>
:root{--vop:#203D2D;--tvd:#237A4A;--voc:#0F2913;--lima:#A6EF34;--gris:#E5E5E5;--beige:#F7F6F0;--blanco:#FFFFFF;--negro:#111111;--r:6px;--sh:0 2px 10px rgba(15,41,19,.13);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;background:var(--beige)}
body{font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:var(--negro)}
#topbar{background:var(--voc);color:var(--lima);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh);gap:10px;flex-wrap:wrap}
#topbar h1{font-size:1.05rem;font-weight:700;letter-spacing:.03em}
#topbar .sub{font-size:.74rem;color:rgba(166,239,52,.6);margin-top:1px}
.tbtn{border:none;border-radius:var(--r);padding:6px 14px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
#print-btn{background:var(--lima);color:var(--voc)}
#edit-btn{background:rgba(166,239,52,.2);color:var(--lima);border:1px solid rgba(166,239,52,.4)}
#edit-btn.on{background:var(--lima);color:var(--voc)}
#reset-btn{background:rgba(255,80,60,.15);color:#ff6450;border:1px solid rgba(255,80,60,.3);display:none}
#tabs{display:flex;gap:4px;padding:12px 18px 0;overflow-x:auto;background:var(--beige);border-bottom:2px solid var(--gris);position:sticky;top:49px;z-index:90}
.tab{padding:7px 15px;border-radius:var(--r) var(--r) 0 0;border:none;background:var(--gris);color:var(--vop);font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
.tab.active,.tab:hover{background:var(--tvd);color:var(--lima)}
#main{max-width:1280px;margin:0 auto;padding:18px 14px 60px}
.info-bar{background:var(--voc);color:var(--blanco);border-radius:var(--r);padding:14px 20px;margin-bottom:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.info-bar h2{grid-column:1/-1;font-size:.8rem;color:var(--lima);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.info-item{font-size:.77rem;line-height:1.6;color:rgba(255,255,255,.82)}
.info-item strong{display:block;color:var(--lima);font-size:.67rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}
.wk-panel{display:none}.wk-panel.active{display:block}
.wk-label{background:var(--tvd);color:var(--lima);padding:8px 16px;font-size:.82rem;font-weight:700;border-radius:var(--r);margin-bottom:12px;letter-spacing:.03em}
.festivo-note{background:#E3F2FD;border-left:3px solid #1976D2;padding:7px 14px;font-size:.77rem;color:#0D47A1;border-radius:0 var(--r) var(--r) 0;margin-bottom:12px;font-weight:600}
.card{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.chdr{padding:9px 14px;font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--blanco)}
.chdr.lima{color:var(--lima)}
.sub-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:12px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{padding:7px 8px;font-size:.73rem;font-weight:700;text-align:center;border-right:1px solid rgba(255,255,255,.2);color:var(--blanco)}
th:last-child{border-right:none}
td{padding:5px 7px;font-size:.77rem;vertical-align:top;border-right:1px solid var(--gris);border-bottom:1px solid var(--gris);color:var(--voc);line-height:1.5;transition:background .1s}
td:last-child{border-right:none}
tr:last-child td{border-bottom:none}
.ra{background:var(--beige)}.rb{background:var(--blanco)}
.sh{background:var(--lima)!important;color:var(--voc)!important}
.sd{background:#f0fcd8}
body.edit td[data-k]{cursor:pointer}
body.edit td[data-k]:hover{background:#e6ffc2!important;outline:2px solid var(--lima);outline-offset:-1px}
td.mod{border-left:3px solid var(--lima)!important}
td input.ei{width:100%;border:none;outline:none;background:transparent;font-size:.77rem;font-family:inherit;color:var(--voc);padding:0;min-width:60px}
.cg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));padding:0 14px 40px;max-width:1280px;margin:0 auto}
.cc{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.cch{padding:8px 14px;font-size:.8rem;font-weight:700;color:var(--blanco)}
.cr{display:flex;justify-content:space-between;padding:5px 14px;font-size:.78rem}
.cr:nth-child(odd){background:var(--beige)}
.cd{font-weight:700;color:var(--tvd)}.cp{color:#999;font-size:.7rem}
.btabs{display:flex;gap:6px;padding:16px 14px 0;max-width:1280px;margin:0 auto}
.bt{padding:6px 16px;border-radius:var(--r) var(--r) 0 0;border:none;background:var(--gris);color:var(--vop);font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.bt.active,.bt:hover{background:var(--voc);color:var(--lima)}
#cw{display:none}
@media print{#topbar,#tabs,.btabs{display:none!important}.wk-panel{display:block!important}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<div id="topbar">
  <div>
    <h1>🌿 KOLTIN — GUARDIAS NOVIEMBRE 2026</h1>
    <div class="sub">CDMX 6/día · SF 1/día · GDL 3/día · 16 Nov día festivo</div>
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <button id="edit-btn" class="tbtn" onclick="toggleEdit()">✏️ Editar</button>
    <button id="reset-btn" class="tbtn" onclick="resetAll()">↺ Restablecer</button>
    <button id="print-btn" class="tbtn" onclick="window.print()">🖨 Imprimir</button>
  </div>
</div>
<div id="tabs"></div>
<div id="main">
  <div class="info-bar">
    <h2>📋 Información general</h2>
    <div class="info-item"><strong>Horario</strong>9:00 AM – 6:00 PM · 1 hr comida</div>
    <div class="info-item"><strong>Eventualidades</strong>Cualquier eventualidad avisar a Nat o Lau</div>
    <div class="info-item"><strong>Sin guardia</strong>Bloquear calendario como HO
